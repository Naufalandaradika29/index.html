<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>special gift for you ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#fde8ec;--paper:#fff6f4;--ink:#4a2740;--rose:#e0728f;--lilac:#c9b6ee;--soft:#f6c9d4}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:'Fraunces',Georgia,serif;color:var(--ink);background:radial-gradient(circle at 15% 10%,#ffd3dd 0,transparent 45%),radial-gradient(circle at 90% 90%,#e2d6fa 0,transparent 45%),var(--bg);line-height:1.7;overflow-x:hidden}
.hand{font-family:'Caveat',cursive;font-weight:700}
.screen{display:none;min-height:100vh;padding:48px 22px 90px;max-width:560px;margin:0 auto;text-align:center}
.screen.active{display:block}
h1{font-size:2.2rem;line-height:1.15;margin:10px 0 8px;font-weight:600}
h2{font-size:1.7rem;margin:6px 0 14px;font-weight:600}
.sub{color:var(--rose);font-size:1.7rem;margin-bottom:6px}
.cards{display:grid;gap:18px;margin:34px 0}
.card{background:var(--paper);border:2px solid var(--ink);border-radius:22px 22px 22px 6px;padding:18px;cursor:pointer;display:flex;gap:16px;align-items:center;text-align:left;box-shadow:5px 5px 0 var(--ink);transition:transform .15s,box-shadow .15s;font:inherit;color:inherit;width:100%}
.card:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.card:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
.card .thumb{width:76px;height:76px;border-radius:14px;background:var(--soft);flex:none;object-fit:cover;display:grid;place-items:center;font-size:2rem}
.card b{font-size:1.15rem;display:block}
.card small{opacity:.75}
.tag{display:inline-block;margin-top:4px;font-size:.8rem;background:var(--lilac);border-radius:99px;padding:1px 10px}
.btn{font:inherit;background:var(--ink);color:#fff;border:0;border-radius:99px;padding:12px 26px;cursor:pointer;font-size:1rem}
.back{background:none;border:0;font:inherit;color:var(--ink);cursor:pointer;opacity:.7;margin-bottom:14px;font-size:1rem}
.gift{font-size:7rem;background:none;border:0;cursor:pointer;margin:40px 0 20px;animation:wob 1.6s ease-in-out infinite;line-height:1}
.gift:focus-visible{outline:3px solid var(--rose);outline-offset:6px;border-radius:20px}
.gift.open{animation:pop .5s ease-out forwards}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.06)}}
@keyframes pop{to{transform:scale(.55) translateY(-10px);opacity:.45}}
.sphoto{width:100%;max-height:420px;object-fit:cover;border-radius:6px;border:6px solid #fff;box-shadow:0 4px 14px rgba(74,39,64,.18);margin:6px 0 6px;transform:rotate(-1.2deg)}
.note{font-size:.95rem;opacity:.85}
input.pin{font:inherit;font-size:1.8rem;letter-spacing:.5em;text-align:center;width:250px;padding:10px 6px 10px 18px;border:2px solid var(--ink);border-radius:16px;background:var(--paper);color:var(--ink);margin:18px 0 8px}
.err{color:#b3264a;min-height:1.6em;font-size:.95rem}
.shake{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.gallery{margin:26px 0}
.gallery img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;border:6px solid #fff;box-shadow:0 4px 14px rgba(74,39,64,.18);cursor:zoom-in;transform:rotate(-1deg)}
.slide-controls{display:flex;align-items:center;justify-content:center;gap:22px;margin:18px 0 12px}
.slide-nav{width:44px;height:44px;border:2px solid var(--ink);border-radius:50%;background:var(--paper);color:var(--ink);font:inherit;font-size:1.3rem;cursor:pointer}
.slide-nav:focus-visible,.slide-play:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
.slide-counter{min-width:72px}
.slide-play{padding:9px 20px}
.letter{background:var(--paper);border-radius:6px 22px 22px 22px;padding:26px 22px;text-align:left;box-shadow:6px 6px 0 var(--lilac);border:2px solid var(--ink);margin:26px 0}
.letter p{margin-bottom:14px}
.letter p:last-child{margin:0}
.lightbox{position:fixed;inset:0;background:rgba(40,16,36,.88);display:none;place-items:center;z-index:20;padding:20px}
.lightbox.on{display:grid}
.lightbox img{max-width:100%;max-height:90vh;border-radius:8px}
.heart{position:fixed;bottom:-30px;pointer-events:none;animation:fl 3.5s linear forwards;z-index:15}
@keyframes fl{to{transform:translateY(-110vh);opacity:0}}
@media (prefers-reduced-motion:reduce){.gift{animation:none}.heart{display:none}.shake{animation:none}.card{transition:none}}
</style>
</head>
<body>

<!-- ENTRY LOCK -->
<main class="screen active" id="entry">
  <div style="font-size:4rem;margin-top:12vh">🔐</div>
  <p class="hand sub">a little surprise for you ♡</p>
  <h1>this gift is just for you</h1>
  <p class="note">masukkan PIN untuk membuka hadiah ini ♡</p>
  <form id="entryForm" autocomplete="off">
    <input class="pin" id="entryPin" type="password" inputmode="numeric" maxlength="6" aria-label="PIN pembuka 6 digit" autofocus>
    <div class="err" id="entryErr" role="alert"></div>
    <button class="btn" type="submit">open my gift ♡</button>
  </form>
</main>

<!-- HOME -->
<main class="screen" id="home">
  <p class="hand sub" id="fromLine"></p>
  <h1 id="title"></h1>
  <p id="greet"></p>
  <div class="cards">
    <button class="card" data-go="msg">
      <img class="thumb" src="assets/photos/envelope.jpg" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'thumb',textContent:'✉️'}))">
      <span><b>birthday message</b><small>a little something from me</small><br><span class="tag">available</span></span>
    </button>
    <button class="card" data-go="surprise">
      <img class="thumb" src="assets/photos/surprise.jpg" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'thumb',textContent:'🎁'}))">
      <span><b>surprise</b><small>tap to open it</small><br><span class="tag">available</span></span>
    </button>
    <button class="card" data-go="pin">
      <img class="thumb" src="assets/photos/secret.jpg" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'thumb',textContent:'🔐'}))">
      <span><b>our secret</b><small>psst... only for you</small><br><span class="tag">🔒 locked</span></span>
    </button>
  </div>
  <p class="hand" style="font-size:1.4rem">made with love, just for you ♡</p>
</main>

<!-- SURPRISE -->
<main class="screen" id="surprise">
  <button class="back" data-go="home">← back</button>
  <p class="hand sub" id="sHint"></p>
  <button class="gift" id="giftBtn" aria-label="Buka kado">🎁</button>
  <div id="reveal" hidden>
    <h2 id="sTitle"></h2>
    <div class="gallery" id="gallery" role="region" aria-roledescription="carousel" aria-label="Galeri kenangan">
      <img id="slidePhoto" alt="Foto kenangan" aria-label="Klik foto untuk memperbesar">
      <div class="slide-controls">
        <button class="slide-nav" id="prevPhoto" type="button" aria-label="Foto sebelumnya">←</button>
        <p class="slide-counter" id="slideCounter" aria-live="polite" aria-atomic="true"></p>
        <button class="slide-nav" id="nextPhoto" type="button" aria-label="Foto berikutnya">→</button>
      </div>
      <button class="btn slide-play" id="toggleSlideshow" type="button">Jeda slideshow</button>
    </div>
    <img id="sPhoto" class="sphoto" alt="" hidden>
    <div class="letter" id="sText"></div>
  </div>
</main>

<!-- PIN -->
<main class="screen" id="pin">
  <button class="back" data-go="home">← back</button>
  <div style="font-size:3rem;margin-top:30px">🔐</div>
  <p class="hand sub">hmm... you found the secret one</p>
  <h2>enter the secret pin ♡</h2>
  <p class="note" id="hint"></p>
  <form id="pinForm" autocomplete="off">
    <input class="pin" id="pinInput" type="password" inputmode="numeric" maxlength="6" aria-label="PIN 6 digit">
    <div class="err" id="err" role="alert"></div>
    <button class="btn" type="submit">unlock ♡</button>
  </form>
</main>

<!-- MESSAGE (terbuka) -->
<main class="screen" id="msg">
  <button class="back" data-go="home">← back</button>
  <p class="hand sub">a little letter for you ♡</p>
  <h1 id="mTitle"></h1>
  <div class="letter" id="letter"></div>
  <h2 id="mEnd"></h2>
  <button class="btn" data-go="home">← back to the beginning</button>
</main>

<!-- SECRET (dikunci PIN) -->
<main class="screen" id="secret">
  <button class="back" data-go="home">← back</button>
  <p class="hand sub">finally... you unlocked this ♡</p>
  <h2 id="secTitle"></h2>
  <p class="hand" style="font-size:1.5rem" id="secEnd"></p>
  <button class="btn" data-go="home">← back to the beginning</button>
</main>

<div class="lightbox" id="lb"><img alt=""></div>

<script>
/* ============ EDIT BAGIAN INI AJA ============ */
const CONFIG = {
  from: "a little something from your girlfriend ♡",
  title: "Special gift for you",
  greeting: "Happy birthday yang ke 23, Nur Alika Pandoyo Putri! ❤️🎂<br>Semoga di usia yang baru ini semua hal baik selalu datang menghampirimu. Terima kasih sudah hadir dan menjadi bagian terindah dalam hidupku. Semoga kamu selalu bahagia, sehat, dan semua impianmu bisa terwujud. I’m so lucky to have you. I love you, always! ❤️",
  secretPin: "131103",                     // PIN untuk membuka halaman dan secret
  pinHint: "maybe you know the special number? 🤭",
  surprise: {
    hint: "ada sesuatu buat kamu... ketuk kadonya ♡",
    title: "surprise!! 🎉",
    text: [
      "(tulis kejutannya di sini, misal: tiket nonton, voucher, atau ajakan jalan)",
      "(boleh lebih dari satu paragraf)"
    ],
    photo: "surprise.jpg"                  // taruh foto surprise dengan nama ini di assets/photos/
  },
  secretTitle: "our little memories ♡",
  secretEnd: "ini baru sebagian, masih banyak yang mau kita bikin bareng ♡",
  photos: ["foto1.jpeg","foto2.jpeg","foto3.jpeg","foto4.jpeg","foto5.jpeg","foto6.jpeg","foto7.jpeg","foto8.jpeg","foto9.jpeg","foto10.jpeg","foto11.jpeg","foto12.jpeg","foto13.jpeg","foto14.jpeg","foto15.jpeg","foto16.jpeg","foto17.jpeg","foto18.jpeg","foto19.jpeg","foto20.jpeg","foto21.jpeg"],
  messageTitle: "haii sayanggg...",
  letter: [
    "Selamat ulang tahun yang ke-23, sayangkuuu ♡",
    "Makasih ya udah jadi kamu. Hari-hariku jadi lebih ringan sejak ada kamu. Hal sesederhana dengerin ceritamu, ketawa bareng, atau cuma diem-dieman berdua aja rasanya udah cukup buat aku.",
    "Aku bangga banget sama kamu. Sama kerja kerasmu, sama hatimu yang baik, dan sama caramu yang terus berusaha walau kadang capek. Mungkin kamu ngerasa belum ngapa-ngapain, tapi di mataku kamu udah hebat banget.",
    "Dua puluh tiga itu bukan cuma angka. Ini awal bab baru, dan aku pengen jadi orang yang ada di sebelahmu di setiap halamannya, pas lagi seneng maupun pas lagi berat.",
    "Semoga di umur yang baru ini kamu selalu sehat, rezekimu lancar, cita-citamu satu per satu dibukain jalannya, dan kamu dikelilingi orang-orang yang sayang sama kamu. Semoga kamu juga lebih sering inget kalau kamu itu berharga banget.",
    "Im always going to be your support system, no matter what. ♡"
  ],
  ending: "i love u so much, sayangg"
};
/* =============================================== */

const $ = s => document.querySelector(s);
$('#fromLine').textContent = CONFIG.from;
$('#title').textContent = CONFIG.title;
$('#greet').innerHTML = CONFIG.greeting;
$('#hint').textContent = CONFIG.pinHint;
$('#mTitle').textContent = CONFIG.messageTitle;
$('#mEnd').textContent = CONFIG.ending;
$('#secTitle').textContent = CONFIG.secretTitle;
$('#secEnd').textContent = CONFIG.secretEnd;
$('#sHint').textContent = CONFIG.surprise.hint;
$('#sTitle').textContent = CONFIG.surprise.title;
$('#sText').innerHTML = CONFIG.surprise.text.map(p => `<p>${p}</p>`).join('');
if(CONFIG.surprise.photo){ const p=$('#sPhoto'); p.src='assets/photos/'+CONFIG.surprise.photo; p.hidden=false; p.onerror=()=>p.remove(); }
$('#giftBtn').addEventListener('click', e => {
  e.currentTarget.classList.add('open');
  $('#reveal').hidden=false;
  showPhoto(0);
  startSlideshow();
  hearts();
  setTimeout(()=>$('#reveal').scrollIntoView({behavior:'smooth',block:'start'}),300);
});
$('#entryForm').addEventListener('submit', e => {
  e.preventDefault();
  if($('#entryPin').value === CONFIG.secretPin){
    show('home');
  } else {
    $('#entryErr').textContent = 'PIN-nya belum benar, coba lagi ya 🤭';
    const input = $('#entryPin');
    input.classList.remove('shake');
    void input.offsetWidth;
    input.classList.add('shake');
    input.select();
  }
});
$('#letter').innerHTML = CONFIG.letter.map(p => `<p>${p}</p>`).join('');
let slideIndex = 0;
let slideTimer;
let slideshowPlaying = false;
const slidePhoto = $('#slidePhoto');
const slideCounter = $('#slideCounter');
const slideshowButton = $('#toggleSlideshow');

function showPhoto(index){
  slideIndex = (index + CONFIG.photos.length) % CONFIG.photos.length;
  slidePhoto.src = `assets/photos/${CONFIG.photos[slideIndex]}`;
  slidePhoto.alt = `Foto kenangan ${slideIndex + 1} dari ${CONFIG.photos.length}`;
  slideCounter.textContent = `${slideIndex + 1} / ${CONFIG.photos.length}`;
}

function setSlideshowPlaying(shouldPlay){
  clearInterval(slideTimer);
  slideshowPlaying = shouldPlay && CONFIG.photos.length > 1;
  if(slideshowPlaying){
    slideTimer = setInterval(()=>showPhoto(slideIndex + 1),5000);
  }
  slideshowButton.textContent = slideshowPlaying ? 'Jeda slideshow' : 'Putar slideshow';
}

function startSlideshow(){
  setSlideshowPlaying(true);
}

showPhoto(0);
$('#prevPhoto').addEventListener('click',()=>showPhoto(slideIndex - 1));
$('#nextPhoto').addEventListener('click',()=>showPhoto(slideIndex + 1));
setSlideshowPlaying(false);
slideshowButton.addEventListener('click',()=>{
  if(slideshowPlaying){
    setSlideshowPlaying(false);
  } else {
    setSlideshowPlaying(true);
  }
});

function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  scrollTo(0,0);
  if(id === 'surprise'){ $('#giftBtn').classList.remove('open'); $('#reveal').hidden=true; }
  if(id === 'pin'){ $('#pinInput').value=''; $('#err').textContent=''; setTimeout(()=>$('#pinInput').focus(),50); }
  setSlideshowPlaying(false);
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go]');
  if(t){ show(t.dataset.go); }
});

function hearts(){
  const em = ['💗','💖','🩷','✨','💕'];
  for(let i=0;i<22;i++){
    const h = document.createElement('div');
    h.className='heart'; h.textContent=em[i%em.length];
    h.style.left=Math.random()*95+'vw';
    h.style.fontSize=(16+Math.random()*22)+'px';
    h.style.animationDelay=(Math.random()*1.2)+'s';
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),5000);
  }
}
$('#pinForm').addEventListener('submit', e => {
  e.preventDefault();
  if($('#pinInput').value === CONFIG.secretPin){ show('secret'); hearts(); }
  else {
    $('#err').textContent = 'hmm, belum bener nih. coba inget-inget lagi ya 🤭';
    const i = $('#pinInput'); i.classList.remove('shake'); void i.offsetWidth; i.classList.add('shake'); i.select();
  }
});

// lightbox
const lb = $('#lb');
slidePhoto.addEventListener('click', () => { lb.querySelector('img').src=slidePhoto.src; lb.classList.add('on'); });
lb.addEventListener('click', () => lb.classList.remove('on'));

</script>
</body>
</html>
